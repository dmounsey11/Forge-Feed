name: forge_feed
description: "ForgeFeed - Livestock & Poultry Feed Ration Calculator & Pantry Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  provider: ^6.1.2
  http: ^1.6.0
  url_launcher: ^6.3.1
  in_app_purchase: ^3.2.3
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/usda_ingredients.json
    - assets/data/livestock_feeds.json
    - assets/data/store_feeds.json
    - assets/data/pet_kibble.json
    - assets/data/animal_requirements.json
    - assets/data/ingredients.json
    - assets/images/logo.png
    - assets/images/background.png
    - assets/images/createbutton.png
    - assets/data/safety_rules.json
    - assets/data/species_catalog.json