name: forge_feed
description: "ForgeFeed - Livestock & Poultry Feed Ration Calculator & Pantry Manager"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  provider: ^6.1.2
  http: ^1.6.0
  url_launcher: ^6.3.1
  in_app_purchase: ^3.2.3
  google_mobile_ads: ^9.0.0
  upgrader: ^13.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/livestock_feeds.json
    - assets/data/store_feeds.json
    - assets/data/pet_kibble.json
    - assets/data/animal_requirements.json
    - assets/data/ingredients.json
    - assets/images/logo.png
    - assets/images/background.jpg
    - assets/images/createbutton.png
    - assets/data/safety_rules.json
    - assets/data/species_catalog.json

# Run `flutter pub run flutter_launcher_icons` after changing the source
# images below to regenerate the Android launcher icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1A1A1C"
  adaptive_icon_foreground: "assets/images/icon.png"